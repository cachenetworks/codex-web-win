name: Validate headless runtime

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-validation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Tests
        shell: pwsh
        run: |
          if (Test-Path ./tests) {
            bun run test
          } else {
            Write-Host "No ./tests directory exists in this fork; skipping test command."
          }
      - name: Build
        run: bun run build
      - name: Verify
        run: bun run verify
